services:
  # API: docker compose up --build
  app:
    build:
      context: .
      target: runtime
    image: retroflow:latest
    ports:
      - "8080:8080"
    environment:
      # H2 console binds to localhost by default; allow access from the host browser.
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
      # Passed through from your shell for the summary endpoint; the value never goes in this file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RETROFLOW_SUMMARY_MAX_ITEMS: ${RETROFLOW_SUMMARY_MAX_ITEMS:-500}
      RETROFLOW_SUMMARY_TIMEOUT: ${RETROFLOW_SUMMARY_TIMEOUT:-30s}
    restart: unless-stopped

  # Web UI on http://localhost:5173, proxying /api to the app: docker compose up --build app ui
  ui:
    build:
      context: ./ui
    image: retroflow-ui:latest
    ports:
      - "5173:8080"
    depends_on:
      - app
    restart: unless-stopped

  # Tests: docker compose run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    volumes:
      - m2:/root/.m2

  # Dev loop with live source: docker compose run --rm --service-ports dev
  dev:
    image: maven:3.9-eclipse-temurin-21
    profiles: ["dev"]
    working_dir: /workspace
    command: ["mvn", "-B", "-Dmaven.test.skip=true", "spring-boot:run"]
    ports:
      - "8080:8080"
    environment:
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"
    volumes:
      - .:/workspace
      - m2:/root/.m2

volumes:
  m2:
