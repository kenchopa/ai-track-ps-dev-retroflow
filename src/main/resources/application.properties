spring.application.name=retroflow

# In-memory H2 database — no persistence required between restarts (see the brief).
spring.datasource.url=jdbc:h2:mem:retroflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console, handy for local debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Health endpoint used by the Docker HEALTHCHECK: http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health

# Retrospective summary (POST /api/retrospectives/{id}/summary), written by an OpenAI model.
# The API key is NOT configured here: it is read from the OPENAI_API_KEY environment variable
# (StackCraft standard 5.1). Without it the endpoint answers 503 and nothing is called.
retroflow.summary.base-url=https://api.openai.com/v1
retroflow.summary.model=gpt-4.1-mini
retroflow.summary.temperature=0.2
retroflow.summary.timeout=30s
retroflow.summary.max-items=500
retroflow.summary.prompt=classpath:prompts/retro-summary.txt
