spring.application.name=retroflow

# In-memory H2 database — no persistence required between restarts (see the brief).
spring.datasource.url=jdbc:h2:mem:retroflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console, handy for local debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true
